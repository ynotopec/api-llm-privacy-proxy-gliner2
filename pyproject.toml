[project]
name = "api-llm-privacy-proxy-gliner2"
version = "0.1.0"
description = "OpenAI-compatible privacy proxy using fastino/gliner2-privacy-filter-PII-multi"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "gliner2>=0.1.0",
  # Transformers 5 claims GLiNER2's `extractor` model type and produces an
  # ExtractorConfig without the span settings (for example, max_width).
  "transformers>=4.48,<5",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
